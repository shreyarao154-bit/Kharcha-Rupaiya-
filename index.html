<!DOCTYPE html>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #7c3aed;
            --secondary: #2dd4bf;
            --bg: #05070a;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(124, 58, 237, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(45, 212, 191, 0.05) 0%, transparent 40%);
            color: white; margin: 0; overflow-x: hidden;
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; }
        .logo { font-weight: 800; font-size: 20px; color: var(--primary); letter-spacing: -1px; }

        .hero { text-align: center; padding: 60px 0; position: relative; }
        .app-icon {

            background: linear-gradient(135deg, var(--primary), #4f46e5);
            margin: 0 auto 25px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 20px 40px rgba(124, 58, 237, 0.3);
            border: 2px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }
        .app-icon img { width: 100%; height: 100%; object-fit: cover; }

        h1 { font-size: clamp(32px, 8vw, 56px); font-weight: 800; margin: 0; line-height: 1.1; }
        .badge { 
            background: var(--glass); border: 1px solid var(--border); padding: 6px 16px;
            border-radius: 100px; font-size: 12px; font-weight: 600; color: var(--secondary);
            display: inline-block; margin-bottom: 20px;
        }

        .stats-bar {
            display: flex; justify-content: center; gap: 30px; margin: 40px 0;
            padding: 20px; background: var(--glass); border-radius: 24px; border: 1px solid var(--border);
        }
        .stat-item b { display: block; font-size: 20px; color: white; }
        .stat-item span { font-size: 12px; color: #64748b; }

        .download-box { margin: 40px 0; }
        .btn-main {
            background: white; color: black; padding: 20px 50px; border-radius: 100px;
            font-weight: 800; font-size: 18px; text-decoration: none; display: inline-block;
            transition: 0.3s; box-shadow: 0 10px 30px rgba(255,255,255,0.1);
            cursor: pointer;
        }
        .btn-main:hover { transform: scale(1.05); background: var(--secondary); }
        
        .version-info { font-size: 13px; color: #64748b; margin-top: 15px; }

        #loading {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 1000; flex-direction: column; align-items: center; justify-content: center;
        }
        .spinner { width: 50px; height: 50px; border: 5px solid var(--glass); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        iframe#download_frame { display: none; }
    </style>
</head>
<body>

    <script>
        function startDownload() {
            document.getElementById('loading').style.display = 'flex';
            
            // Your Google Drive Direct Download ID
            const fileId = '1gmh7GVdwFIjGPdOpHr0fJ61rguzeyFNZ'; 
            const downloadUrl = `https://drive.google.com/uc?export=download&id=${fileId}`;

            setTimeout(() => {
                // Using hidden iframe so user stays on the same page
                document.getElementById('download_frame').src = downloadUrl;
                
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                    alert("Download started! Check your notification bar.");

</html>
